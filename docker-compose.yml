name: solar-wash
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-solar-wash}-db
    environment:
      MYSQL_ROOT_PASSWORD: solarroot
      MYSQL_DATABASE: solar
      MYSQL_USER: solar
      MYSQL_PASSWORD: solar
    ports: ["${DB_PORT:-17723}:3306"]
    volumes: ["db_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u solar -psolar solar -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 4s
      timeout: 4s
      retries: 45
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-solar-wash}-redis
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-solar-wash}-backend
    environment: &env
      DATABASE_URL: mysql+pymysql://solar:solar@db:3306/solar
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-solar-wash-demo}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["${BACKEND_PORT:-19223}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 4s
      timeout: 4s
      retries: 30
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-solar-wash}-worker
    command: ["python", "-m", "src.worker"]
    environment: *env
    volumes: ["artifacts:/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time;assert time.time()-os.stat('/tmp/solar-heartbeat').st_mtime<20"]
      interval: 4s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-solar-wash}-frontend
    ports: ["${FRONTEND_PORT:-18223}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 30
volumes:
  db_data:
  redis_data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.221.24.0/24}
